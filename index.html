<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd3ff" />
    <title>Salto con la pasta</title>
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas" width="800" height="450"></canvas>
      <div id="overlay">
        <div class="panel">
          <h1>Salto con la pasta</h1>
          <p id="message" class="message"></p>
          <label>Altezza dell'asticella <output id="o-bar"></output>
            <input id="bar" type="range" min="1" max="5" step="0.1" />
          </label>
          <label>Umidità della pasta <output id="o-moisture"></output>
            <input id="moisture" type="range" min="5" max="15" step="0.5" />
          </label>
          <label>Spessore della pasta <output id="o-thickness"></output>
            <input id="thickness" type="range" min="1" max="3" step="0.1" />
          </label>
          <label>Lunghezza della pasta <output id="o-length"></output>
            <input id="length" type="range" min="2.5" max="5.5" step="0.1" />
          </label>
          <button id="start" type="button">Inizia</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
