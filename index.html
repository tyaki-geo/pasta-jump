<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd3ff" />
    <title>パスタ棒高跳び</title>
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas" width="800" height="450"></canvas>
      <div id="overlay">
        <div class="panel">
          <h1>パスタ棒高跳び</h1>
          <p id="message" class="message">タップ/クリック/スペースキーで操作します（横向き推奨）</p>
          <p id="stats" class="stats"></p>
          <label>バーの高さ <output id="o-bar"></output>
            <input id="bar" type="range" min="1" max="5" step="0.1" />
          </label>
          <label>パスタの水分量 <output id="o-moisture"></output>
            <input id="moisture" type="range" min="0" max="100" step="1" />
          </label>
          <label>パスタの太さ <output id="o-thickness"></output>
            <input id="thickness" type="range" min="1" max="3" step="0.1" />
          </label>
          <label>パスタの長さ <output id="o-length"></output>
            <input id="length" type="range" min="2.5" max="5.5" step="0.1" />
          </label>
          <p id="traits" class="traits"></p>
          <button id="start" type="button">スタート</button>
          <p class="hint">地面のゲージで、緑がバーに重なったらタップして押しっぱなし（パスタを突く）→ 次の緑がバーに重なったら指を離す。緑を正確に捉えるほど成功しやすい</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
